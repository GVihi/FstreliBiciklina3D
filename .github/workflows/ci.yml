name: CI

# Runs on every pull request and on every push to main.
#   lint    - gdlint on the GDScript
#   format  - gdformat --check (run `gdformat scripts/ tools/` to fix a failure)
#   load    - imports the project and runs it headless in Godot, fails on any script error
#   build_info - tools/make_build_info.py and tools/version_compare.py --self-test and tools/windows_version_info.py (roadmap V2.1, V2.3, V2.4)
#   secrets - tools/secrets_check.py over every commit of the pull request (or push), fails on a key-like string
#   checks  - runs every tools/*_check.gd headless with `python tools/run_checks.py` (about 10 minutes)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with config/features in project.godot.
  GODOT_VERSION: "4.7-stable"
  # Version the lint and format jobs were set up and tested with.
  GDTOOLKIT_VERSION: "4.5.0"

jobs:
  lint:
    name: GDScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      # Rules are configured in .gdlintrc at the repository root.
      - run: gdlint scripts/ tools/

  format:
    name: GDScript format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - run: gdformat --check scripts/ tools/

  secrets:
    name: Secrets scan (tools/secrets_check.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the commits of the pull request can be listed against the base branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test of the scanner
        run: python tools/secrets_check.py --self-test
      - name: Scan the commits of this pull request or push
        env:
          # Passed as environment variables, never pasted into the script text.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Prints the file, line and kind of each finding, never the value.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "Scanning ${range}"
          python tools/secrets_check.py --range "$range"

  build_info:
    name: Build info (tools/make_build_info.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test of the build info script
        run: python tools/make_build_info.py --self-test
      - name: Version comparison against the shared cases
        run: python tools/version_compare.py --self-test
      - name: Windows file information of the export preset
        run: python tools/windows_version_info.py --self-test

  load:
    name: Godot headless project load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          rm godot.zip

      - name: Import assets
        run: |
          # Builds the .godot cache (imported models, textures and audio) that the game loads.
          godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --import

      - name: Load the project and run 120 frames
        run: |
          # Godot exits with 0 even when a script fails to parse, so the log is scanned too.
          set +e
          godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --quit-after 120 \
            2>&1 | tee godot-load.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Godot exited with status $status"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|^ERROR:" godot-load.log; then
            echo "::error::Godot reported script or load errors (see the log above)"
            exit 1
          fi

  checks:
    name: Headless checks (tools/run_checks.py)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          rm godot.zip

      - name: Import assets
        run: godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --import

      - name: Run every check
        # Each check gets its own empty save folder. Exit code 1 when any check fails.
        run: python3 tools/run_checks.py --godot godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Keep the check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check_logs
          path: check_logs/
          if-no-files-found: ignore
