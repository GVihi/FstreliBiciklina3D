; secrets.example.cfg: the TEMPLATE for the game's secrets (roadmap V1.2). Every value here is FAKE.
; This file is tracked, so it must never hold a real key. Real values never go into the repository
; (see "Secrets and credentials" in README.md).
;
; To use real values while developing:
;   1. copy this file to `secrets.local.cfg` in the project folder, next to project.godot
;      (`secrets.local.*` is ignored by git, see .gitignore),
;   2. put the real values in the copy,
;   or set the environment variables named below (FB3D_<SECTION>_<KEY> in capitals), which win over the file.
;
; Rules (scripts/secrets.gd):
;   - nothing here is needed: with no file and no variable the game starts and plays offline, and only the
;     online features stay off,
;   - a value that still looks like this template (starts with "fake", contains ".invalid" or "replace-me") is
;     treated as not set, so an unedited copy never sends a fake key anywhere,
;   - the values are read only when the game runs from the Godot editor binary. An exported game gets its
;     values from the build (roadmap V4.1) and never reads this file or these variables,
;   - nothing prints a value: the game only says which source a value came from.

[api]
; FB3D_API_BASE_URL: the website's API address, ending in the version path (see docs/WEBSITE_API.md, V3.2)
base_url="https://fb3d.invalid/fb3d/api/v1/"
; FB3D_API_KEY: the game's API key (roadmap V3.4). The real one comes from the site's owner, never from this repository
key="fake-key-replace-me-0000"
